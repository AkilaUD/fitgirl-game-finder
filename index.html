<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Finder — fit FitGirl repacks to your PC</title>
    <meta
      name="description"
      content="Filter FitGirl repacks by download size and release date, and see which ones your PC meets the minimum or recommended requirements for."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%237CFC00' width='32' height='32' rx='3'/><path fill='%230E1111' d='M6 6h20v8h-8v12H6z'/></svg>" />
    <script>
      try {
        var t = localStorage.getItem('rf.theme');
        document.documentElement.dataset.theme = t === 'cyber' ? 'cyber' : 'neon';
      } catch (e) {
        document.documentElement.dataset.theme = 'neon';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
