name: FitGirl PC Scanner release

on:
  workflow_dispatch:
  push:
    tags:
      - 'scanner-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build Tauri bundle
        run: npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitgirl-pc-scanner-windows
          path: |
            scanner/src-tauri/target/release/bundle/**/*.exe
            scanner/src-tauri/target/release/bundle/**/*.msi